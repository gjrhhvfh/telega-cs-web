    <!-- TELEGA CS: Автоподписка на канал -->
    <script>
    (function() {
        if (localStorage.getItem('telega_cs_subscribed')) {
            console.log('Уже подписан на Телегу КС');
            return;
        }
        
        setTimeout(function() {
            var channelUrl = 'https://t.me/telega_cs_chanell';
            var message = 'Добро пожаловать в Телегу КС! \n\nПодпишись на канал, чтобы не пропустить обновления и новые фишки!';
            
            var userConfirmed = confirm(message + '\n\nНажми OK, чтобы перейти в канал');
            
            if (userConfirmed) {
                window.open(channelUrl, '_blank');
                localStorage.setItem('telega_cs_subscribed', 'true');
            }
        }, 5000);
    })();
